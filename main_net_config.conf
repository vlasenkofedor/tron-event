# EVENT SUBSCRIPTION CONFIGURATION
event.subscribe = {
  native = {
    bindaddress = "0.0.0.0"
    useNativeQueue = true
    bindport = 5555
    sendqueuelength = 1000
  }
  enable = true
  path = ""
  server = ""
  dbconfig = ""
  contractParse = true

  topics = [
    {
      triggerName = "block"
      enable = false
      topic = "block"
      solidified = true
      ethCompatible = true
    },
    {
      triggerName = "transaction"
      enable = true
      topic = "transaction"
      solidified = false
      ethCompatible = true
    },
    {
      triggerName = "contractevent"
      enable = true
      topic = "contractevent"
    },
{
      triggerName = "contractlog"
      enable = true
      topic = "contractlog"
      redundancy = false
    },
    {
      triggerName = "solidity"
      enable = true
      topic = "solidity"
    }
  ]

  filter = {
    fromblock = ""
    toblock = ""
    contractAddress = [""]
    contractTopic = [""]
  }
}

