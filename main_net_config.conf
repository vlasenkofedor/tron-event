net {
  type = mainnet
  # type = testnet
}

storage {
  # Directory for storing persistent data
  db.directory = "database"
  db.index.directory = "index"
  db.engine = "LEVELDB"

  # Database performance optimization
  db.maxOpenFiles = 10000
  db.compression = true
  txCache.initOptimization = true

  # Auto-repair settings for database stability
  db.repair.force = true
  repair.aggressive = true
  repair.database = true
  auto.repair = true

  # Checkpoint configuration
  checkpoint.sync = true
  checkpoint.version = 2

  # Cache optimization for LiteFullNode (reduced from FullNode settings)
  properties = [
    {
      name = "block",
      cacheSize = 10485760  # 10 MB (reduced for LiteFullNode)
    },
    {
      name = "account",
      cacheSize = 5242880   # 5 MB (reduced for LiteFullNode)
    },
    {
      name = "trans",
      cacheSize = 10485760  # 10 MB (reduced for LiteFullNode)
    }
  ]

  # Transaction cache settings
  txCache.estimatedTransactions = 1000
  needToUpdateAsset = true

  # Merkle root for mainnet verification
  merkleRoot = {
    reward-vi = 9debcb9924055500aaae98cdee10501c5c39d4daa75800a996f4bdda73dbccd8
  }
}

# CRYPTO ENGINE
crypto {
  engine = "eckey"
}

# NODE CORE CONFIGURATION - LITEFULLNODE OPTIMIZED
node {
  tcpNettyWorkThreadNum = 128
  udpNettyWorkThreadNum = 8


  # Network settings
  ipv6Enable = false
  externalIp = "213.136.94.94"
  listen.port = 18888

  walletExtensionApi = true

  # Connection optimization
  maxConnections = 100
  minConnections = 8
  minActiveConnections = 10
  maxConnectionsWithSameIp = 5
  maxHttpConnectNumber = 50
  connection.timeout = 2
  p2p.connection.timeout = 5000

  # P2P network settings
  p2p {
    version = 11111  # Mainnet version
    maxActiveNodes = 30
  }

  # Discovery settings
  discovery.enable = true
  discovery.blacklist = ["134.65.193.120", "138.2.50.149"]
  maxActivePeers = 50
  minActivePeers = 15

  # LiteFullNode specific settings
  openHistoryQueryWhenLiteFN = true  # Enable history queries for LiteFullNode

  # Trust node for faster synchronization (using public TRONGrid endpoint)
  trustNode = "grpc.trongrid.io:50051"

# Fast forward nodes for accelerated block processing
  fastForward = [
    "100.27.171.62:18888",
    "15.188.6.125:18888"
  ]

  # API endpoints configuration
  http {
    fullNodeEnable = true
    fullNodePort = 8090
    solidityEnable = true
    solidityPort = 8091
  }

  # gRPC configuration
  rpc {
    port = 50051
    solidityPort = 50061
    thread = 32  # Optimized for 32 CPU cores
    enableDatabaseAdminApi = true

    minEffectiveConnection = 1
    maxConnectionIdleInMillis = 60000

    maxConcurrentCallsPerConnection = 100
    flowControlWindow = 20971520  # 20 MB
    maxMessageSize = 67108864     # 64 MB
    maxHeaderListSize = 65536     # 64 KB


  }

# JSON-RPC endpoints (EVM compatibility)
  jsonrpc {
    httpFullNodeEnable = true
    httpFullNodePort = 8545
    httpSolidityEnable = true
    httpSolidityPort = 8555
    httpPBFTEnable = true
    httpPBFTPort = 8565
  }

  # Health check endpoint
  healthcheck {
    enable = true
    port = 8090
    checkInterval = 3000
  }

  # DNS discovery (optional)
  dns {
    treeUrls = [
      # "tree://AKMQMNAJJBL73LXWPXDI4I5ZWWIZ4AWO34DWQ636QOBBXNFXH3LQS@main.trondisco.net",
    ]
  }
}

# SYNCHRONIZATION OPTIMIZATION FOR LITEFULLNODE
sync {
  # Timeout and retry settings
  fetchBlock.timeout = 30000
  thread.count = 16  # Optimized for 32 CPU cores (50% utilization)

  # Group synchronization settings
  nodeCountPerGroup = 5
  minBlockCountPerGroup = 50

  # Fork recovery settings
  fork.recovery.enable = true
  fork.recovery.depth = 1000
  fork.recovery.timeout = 60000
}

# TRANSACTION PROCESSING
transaction {
  # Retry mechanism for failed transactions
  error.retry.enable = true
  error.retry.max = 5
  error.retry.delay = 1000

  # Queue optimization
  maxTransactionPendingSize = 20000
  maxTransactionQueueSize = 50000

  # Energy pricing
  defaultEnergyUnitPrice = 100
}

# VIRTUAL MACHINE CONFIGURATION
vm {
  # Performance optimization
  minTimeRatio = 0.0
  maxTimeRatio = 20.0
  longRunningTime = 100

  # Memory management
  saveInternalTx = false
  supportConstant = true
  maxEnergyLimitForConstant = 500000000

  # Error recovery
  error.recovery.enable = true
  error.recovery.maxDepth = 100

  # Energy estimation
  estimateEnergy = true
}

# COMMITTEE SETTINGS
committee {
  allowCreationOfContracts = 0
  allowAdaptiveEnergy = 0
}

# BLOCK PROCESSING
block {
  needSyncCheck = true
  maintenanceTimeInterval = 21600000
  proposalExpireTime = 259200000
}

# Reference block setting for transaction validation
trx.reference.block = "solid"


# LOGGING CONFIGURATION
log {
  root.level = "ERROR"
  level {
    net = "INFO"
    db = "DEBUG"
    consensus = "INFO"
    sync = "DEBUG"
  }
}

# METRICS AND MONITORING
node.metrics = {
  prometheus {
    enable = true
    port = "9527"
  }
}

# RATE LIMITING CONFIGURATION
rate.limiter = {
  # Global rate limits
  global.qps = 50000
  global.ip.qps = 50000

  http = []
  rpc = []
}

