[package]
name = "tron-event-subscriber"
version = "0.1.0"
edition = "2021"
description = "Rust gRPC subscriber example for tron-event node"

# Keep this example independent of the root workspace
[workspace]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
serde_json = "1.0"
sha2 = "0.10"
bs58 = "0.5"

[build-dependencies]
tonic-build = "0.12"
