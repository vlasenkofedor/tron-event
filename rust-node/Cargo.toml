[package]
name = "rust-node"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
prost = "0.13.4"
prost-types = "0.13"
hex = "0.4.3"
sha2 = "0.10.8"
bytes = "1.5.0"
rand = "0.8.5"
bs58 = "0.5.0"
hex-literal = "0.4"
dotenvy = "0.15"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
snap = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lru = "0.12"
dashmap = "6.1"
tonic = "0.12"
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3.32"
# Required for tonic


[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3.0"
